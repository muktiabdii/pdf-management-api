services:
  db:
    image: postgres:15-alpine
    container_name: pdf-db
    restart: always
    environment:
      POSTGRES_DB: pdf_management_db
      POSTGRES_USER: pdf_dev
      POSTGRES_PASSWORD: pdf_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pdf-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app 

volumes:
  pgdata: